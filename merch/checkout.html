<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Checkout | The Still Got It Collective</title>
  <meta name="description" content="Secure checkout for Still Got It Collective merch." />
  <link rel="canonical" href="https://www.stillgotitcollective.com/merch/checkout.html">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/merch.css" />

  <!-- Google Analytics 4 (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-M23KTK21ZD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-M23KTK21ZD');
  </script>

  <script src="https://js.stripe.com/v3/"></script>
  <!-- Stripe publishable key (injected by GitHub Actions, or set manually for local testing) -->
  <script>
    // Fallback for local development - set your test key here if needed
    // In production, this is set by assets/js/stripe-publishable.js from GitHub Actions
    if (typeof window.STRIPE_PUBLISHABLE_KEY === 'undefined') {
      // Try to load from generated file (will be undefined if file doesn't exist)
      // For local testing, you can uncomment and set your test key:
      // window.STRIPE_PUBLISHABLE_KEY = 'pk_test_...';
      
      // Check if we're on the deployed site and key is missing
      if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        console.error('Stripe publishable key not found. The GitHub Actions workflow may not have run yet, or the NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY secret may not be set correctly.');
      }
    }
  </script>
  <script src="/assets/js/stripe-publishable.js"></script>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="nav-wrapper">
        <a href="/" class="logo">
          <span class="logo-text">Still Got It Collective</span>
        </a>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/merch" class="nav-link">Merch</a></li>
          <li><a href="/about/" class="nav-link">About</a></li>
          <li><a href="/contact/" class="nav-link">Contact</a></li>
          <li><a href="/legal/" class="nav-link">Legal</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main id="main-content" class="merch-main checkout-page">
    <section class="section checkout-section">
      <div class="container">
        <h1 class="section-title" id="checkout-title">Checkout</h1>

        <div id="checkout-error" class="ticket-card checkout-alert" hidden></div>

        <!-- Shipping Form -->
        <div id="shipping-form" class="ticket-card checkout-card">
          <h2 class="merch-h2" id="shipping-title">Shipping Information</h2>
          <form id="shipping-form-el">
            <div class="checkout-form-grid">
              <div class="form-field">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" autocomplete="email" required class="form-input">
              </div>
              <div class="form-field">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" autocomplete="name" required class="form-input">
              </div>
              <div class="form-field">
                <label for="address1">Address Line 1 *</label>
                <input type="text" id="address1" name="address1" autocomplete="address-line1" required class="form-input">
              </div>
              <div class="form-field">
                <label for="address2">Address Line 2</label>
                <input type="text" id="address2" name="address2" autocomplete="address-line2" class="form-input">
              </div>
              <div class="form-row form-row--2">
                <div class="form-field">
                  <label for="city">City *</label>
                  <input type="text" id="city" name="city" autocomplete="address-level2" required class="form-input">
                </div>
                <div class="form-field">
                  <label for="state">State *</label>
                  <input type="text" id="state" name="state" autocomplete="address-level1" required class="form-input">
                </div>
              </div>
              <div class="form-row form-row--2">
                <div class="form-field">
                  <label for="postalCode">ZIP Code *</label>
                  <input type="text" id="postalCode" name="postalCode" autocomplete="postal-code" required class="form-input">
                </div>
                <div class="form-field">
                  <label for="country">Country *</label>
                  <input type="text" id="country" name="country" value="US" autocomplete="country" required class="form-input">
                </div>
              </div>
            </div>
            <div class="checkout-actions">
              <button type="submit" class="btn btn-primary btn-full-width" id="continue-to-payment">Continue to Payment</button>
            </div>
          </form>
        </div>

        <!-- Payment Form -->
        <div id="payment-form" class="ticket-card checkout-card" hidden>
          <h2 class="merch-h2" id="payment-title">Payment</h2>
          <div id="payment-element">
            <!-- Stripe Payment Element will mount here -->
          </div>
          <div class="checkout-actions">
            <button type="button" class="btn btn-primary" id="submit-payment" disabled>Pay Now</button>
            <button type="button" class="btn btn-tertiary" id="back-to-shipping">Back</button>
          </div>
        </div>

        <div id="loading" class="ticket-card" hidden>
          <p id="processing-text">Processing...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 RSP Management Solutions LLC. All rights reserved.</p>
        <a href="/" class="back-to-top">← Back to site</a>
      </div>
    </div>
  </footer>

  <script src="/assets/js/checkout.js"></script>
  <script src="/assets/js/scripts.js"></script>
</body>
</html>
