name = "sgic-merch-api"
main = "src/index.ts"
compatibility_date = "2025-12-13"

# When you're ready, add a route on Cloudflare:
# route = { pattern = "www.stillgotitcollective.com/api/*", zone_name = "stillgotitcollective.com" }

[[d1_databases]]
binding = "DB"
database_name = "sgic-merch"
database_id = "d818d409-6eb3-4a31-80c9-7689808e8d71"

[vars]
# Public site base used for redirect after successful checkout
SITE_BASE_URL = "https://www.stillgotitcollective.com"

# Where the worker fetches the product catalog (used to validate pricing server-side)
MERCH_CATALOG_URL = "https://www.stillgotitcollective.com/content/merch.json"

# REQUIRED: set these as secrets via Cloudflare Dashboard or `wrangler secret put ...`
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# PRINTFUL_TOKEN
