# Decap CMS Configuration
# 
# GitHub Pages Authentication:
# - Uses Cloudflare Worker OAuth client (Sveltia CMS Authenticator)
# - OAuth callback URL: <YOUR_WORKER_URL>/callback

backend:
  name: github
  repo: rpretzer/stillgotit
  branch: main
  base_url: https://sveltia-cms-auth.rpretzer.workers.dev

# Media storage configuration
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  # ============================================
  # CONTENT COLLECTIONS (User-Facing)
  # ============================================
  
  - name: "homepage"
    label: "Homepage"
    description: "Main page content and settings"
    files:
      - name: "site-settings"
        label: "Site Settings"
        file: "content/site.json"
        format: "json"
        fields:
          # SEO & Meta
          - label: "SEO & Meta Tags"
            name: "meta"
            widget: "object"
            fields:
              - { label: "Site Name", name: "siteName", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Meta Description", name: "description", widget: "text" }
              - { label: "Meta Keywords", name: "keywords", widget: "string" }
              - { label: "OG Image URL", name: "ogImage", widget: "string", required: false }
              - { label: "OG URL", name: "ogUrl", widget: "string" }

          # Hero Section
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Background Image URL", name: "imageUrl", widget: "string", required: false }
              - { label: "Proof Text", name: "proofText", widget: "string", required: false, hint: "e.g., '2.4k+ attendees • 47 photos • Merch drop live'" }
              - { label: "Primary CTA Label", name: "ctaPrimaryLabel", widget: "string" }
              - { label: "Primary CTA URL", name: "ctaPrimaryUrl", widget: "string" }
              - { label: "Secondary CTA Label", name: "ctaSecondaryLabel", widget: "string" }
              - { label: "Secondary CTA URL", name: "ctaSecondaryUrl", widget: "string" }

          # Announcement Banner
          - label: "Announcement Banner"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Emoji", name: "emoji", widget: "string", required: false }
              - { label: "Bold Text", name: "strongText", widget: "string" }
              - { label: "Text", name: "text", widget: "string" }
              - { label: "CTA Label", name: "ctaLabel", widget: "string" }
              - { label: "CTA URL", name: "ctaUrl", widget: "string" }

          # Section Titles
          - label: "Section Titles"
            name: "sections"
            widget: "object"
            fields:
              - { label: "Announcements", name: "announcements", widget: "object", fields: [{ label: "Title", name: "title", widget: "string" }] }
              - label: "Events Calendar"
                name: "events"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Empty Message", name: "emptyMessage", widget: "string" }
              - { label: "Gallery", name: "gallery", widget: "object", fields: [{ label: "Title", name: "title", widget: "string" }] }
              - { label: "Tickets & Merch", name: "tickets", widget: "object", fields: [{ label: "Title", name: "title", widget: "string" }] }
              - label: "Instagram"
                name: "instagram"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "text", hint: "Use {handle} placeholder for username" }

          # Tickets & Merch
          - label: "Tickets & Merch"
            name: "tickets"
            widget: "object"
            fields:
              - { label: "Tickets Card Title", name: "ticketsTitle", widget: "string" }
              - { label: "Tickets Card Body", name: "ticketsBody", widget: "text" }
              - { label: "Ticketing URL", name: "ticketsUrl", widget: "string" }
              - { label: "Tickets Button Label", name: "ticketsLabel", widget: "string" }
              - { label: "Tickets Note", name: "ticketsNote", widget: "string", required: false }
              - { label: "Merch Card Title", name: "squareTitle", widget: "string" }
              - { label: "Merch Card Body", name: "squareBody", widget: "text" }
              - { label: "Merch Store URL", name: "squareUrl", widget: "string", hint: "Should be /merch/ for internal store" }
              - { label: "Merch Button Label", name: "squareLabel", widget: "string" }
              - { label: "Merch Note", name: "squareNote", widget: "string", required: false }

          # Instagram
          - label: "Instagram"
            name: "instagram"
            widget: "object"
            fields:
              - { label: "Username (no @)", name: "username", widget: "string" }
              - { label: "Profile URL", name: "profileUrl", widget: "string" }
              - label: "Preview Tiles"
                name: "previews"
                widget: "list"
                required: false
                summary: "{{fields.alt}}"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Alt text", name: "alt", widget: "string", required: false }

          # Footer
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Organization Name", name: "organizationName", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Copyright Text", name: "copyright", widget: "string" }
              - { label: "Quick Links Title", name: "quickLinksTitle", widget: "string" }
              - { label: "Connect Title", name: "connectTitle", widget: "string" }
              - label: "Social Links"
                name: "socialLinks"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

          # Calendar (optional embed)
          - label: "Calendar"
            name: "calendar"
            widget: "object"
            fields:
              - label: "Embed URL (optional)"
                name: "embedUrl"
                widget: "string"
                required: false
                hint: "Google Calendar or Notion embed URL. Leave blank to use built-in calendar."

          # Merch Store (global settings - page-specific settings in Pages > Merch)
          - label: "Merch Store (Global)"
            name: "merch"
            widget: "object"
            fields:
              - { label: "Page Title", name: "pageTitle", widget: "string" }
              - { label: "Page Description", name: "pageDescription", widget: "text" }

          # Checkout Page
          - label: "Checkout Page"
            name: "checkout"
            widget: "object"
            fields:
              - { label: "Page Title", name: "pageTitle", widget: "string" }
              - { label: "Page Description", name: "pageDescription", widget: "text" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Shipping Title", name: "shippingTitle", widget: "string" }
              - { label: "Payment Title", name: "paymentTitle", widget: "string" }
              - { label: "Continue Label", name: "continueLabel", widget: "string" }
              - { label: "Back Label", name: "backLabel", widget: "string" }
              - { label: "Pay Now Label", name: "payNowLabel", widget: "string" }
              - { label: "Processing Label", name: "processingLabel", widget: "string" }
              - { label: "Empty Cart Redirect Message", name: "emptyCartRedirect", widget: "string" }

          # Success Page
          - label: "Success Page"
            name: "success"
            widget: "object"
            fields:
              - { label: "Page Title", name: "pageTitle", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Message", name: "message", widget: "text" }
              - { label: "Note", name: "note", widget: "text" }
              - { label: "Back to Merch Label", name: "backToMerchLabel", widget: "string" }
              - { label: "Back to Site Label", name: "backToSiteLabel", widget: "string" }

  - name: "updates"
    label: "Latest Updates"
    description: "Announcement cards on homepage"
    files:
      - name: "updates-file"
        label: "Updates"
        file: "content/updates.json"
        format: "json"
        fields:
          - label: "Updates"
            name: "updates"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Pinned", name: "pinned", widget: "boolean", default: false, required: false }
              - label: "Image URL (recommended: Cloudflare Images)"
                name: "image"
                widget: "string"
                required: false
                hint: "CDN URL or use Image upload below"
              - label: "Image upload (fallback)"
                name: "imageUpload"
                widget: "image"
                required: false
                hint: "Uploads to assets/images/uploads/"
              - { label: "Image alt text", name: "alt", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "CTA label", name: "ctaLabel", widget: "string", required: false }
              - { label: "CTA URL", name: "ctaUrl", widget: "string", required: false }
              - label: "CTA style"
                name: "ctaStyle"
                widget: "select"
                options:
                  - { label: "Primary", value: "primary" }
                  - { label: "Secondary", value: "secondary" }
                default: "primary"

  - name: "gallery"
    label: "Event Gallery"
    description: "Photo gallery images"
    files:
      - name: "gallery-file"
        label: "Gallery"
        file: "content/gallery.json"
        format: "json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - label: "Full image URL (recommended: Cloudflare Images)"
                name: "src"
                widget: "string"
                required: false
                hint: "CDN URL or use Full image upload below"
              - label: "Full image upload (fallback)"
                name: "srcUpload"
                widget: "image"
                required: false
                hint: "Uploads to assets/images/uploads/"
              - label: "Thumbnail URL (optional)"
                name: "thumb"
                widget: "string"
                required: false
                hint: "CDN URL or use Thumbnail upload below"
              - label: "Thumbnail upload (fallback)"
                name: "thumbUpload"
                widget: "image"
                required: false
              - { label: "Alt text", name: "alt", widget: "string" }
              - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
              - label: "Tags"
                name: "tags"
                widget: "list"
                required: false
                hint: "e.g., 'birthday', 'corporate', 'DJ', 'outdoor'"
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Date", name: "date", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }

  - name: "events"
    label: "Events"
    description: "Event calendar entries"
    files:
      - name: "events-file"
        label: "Events"
        file: "data/events.json"
        format: "json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} - {{fields.date}}"
            fields:
              - { label: "ID", name: "id", widget: "string", required: true, hint: "Unique slug (e.g., 'big-energy-80s')" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Time", name: "time", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Venue", name: "venue", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "CTA Label", name: "ctaLabel", widget: "string", required: false, default: "Get Tickets" }
              - { label: "Ticket URL", name: "ticketUrl", widget: "string", required: false }
              - { label: "Image URL", name: "image", widget: "string", required: false, hint: "Optional poster/hero image" }

  - name: "pages"
    label: "Pages"
    description: "Standalone pages (About, Contact, Legal, Merch)"
    files:
      - name: "about-page"
        label: "About"
        file: "content/pages/about.json"
        format: "json"
        fields:
          - { label: "Meta Title", name: "metaTitle", widget: "string" }
          - { label: "Meta Description", name: "metaDescription", widget: "text" }
          - { label: "Canonical URL", name: "canonicalUrl", widget: "string", required: false }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Body Paragraphs"
                name: "body"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
                hint: "Each item renders as a separate paragraph. HTML is supported."
              - label: "Contacts"
                name: "contacts"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }
                  - { label: "URL (mailto:, tel:, or https)", name: "url", widget: "string", required: false }

      - name: "contact-page"
        label: "Contact"
        file: "content/pages/contact.json"
        format: "json"
        fields:
          - { label: "Meta Title", name: "metaTitle", widget: "string" }
          - { label: "Meta Description", name: "metaDescription", widget: "text" }
          - { label: "Canonical URL", name: "canonicalUrl", widget: "string", required: false }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Body Paragraphs"
                name: "body"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
                hint: "Each item renders as a separate paragraph. HTML is supported."
              - label: "Contacts"
                name: "contacts"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }
                  - { label: "URL (mailto:, tel:, or https)", name: "url", widget: "string", required: false }

      - name: "legal-page"
        label: "Legal"
        file: "content/pages/legal.json"
        format: "json"
        fields:
          - { label: "Meta Title", name: "metaTitle", widget: "string" }
          - { label: "Meta Description", name: "metaDescription", widget: "text" }
          - { label: "Canonical URL", name: "canonicalUrl", widget: "string", required: false }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Body Paragraphs"
                name: "body"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
                hint: "Each item renders as a separate paragraph. HTML is supported."
              - label: "Contacts"
                name: "contacts"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }
                  - { label: "URL (mailto:, tel:, or https)", name: "url", widget: "string", required: false }

      - name: "merch-page"
        label: "Merch"
        file: "content/pages/merch.json"
        format: "json"
        fields:
          - { label: "Meta Title", name: "metaTitle", widget: "string" }
          - { label: "Meta Description", name: "metaDescription", widget: "text" }
          - { label: "Canonical URL", name: "canonicalUrl", widget: "string", required: false }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text", required: false }
          - { label: "Catalog Label", name: "catalogLabel", widget: "string" }
          - { label: "Loading Message", name: "loadingMessage", widget: "string" }
          - { label: "Loading Subtext", name: "loadingSubtext", widget: "text" }
          - { label: "Cart Title", name: "cartTitle", widget: "string" }
          - { label: "Cart Close Label", name: "cartCloseLabel", widget: "string" }
          - { label: "Subtotal Label", name: "subtotalLabel", widget: "string" }
          - { label: "Shipping Note", name: "shippingNote", widget: "text" }
          - { label: "Checkout Label", name: "checkoutLabel", widget: "string" }
          - { label: "Clear Cart Label", name: "clearCartLabel", widget: "string" }
          - { label: "Empty Cart Message", name: "emptyCartMessage", widget: "string" }
          - { label: "Error Message", name: "errorMessage", widget: "string" }

  # ============================================
  # MEDIA COLLECTIONS
  # ============================================
  
  - name: "media"
    label: "📷 Media Library"
    description: "Browse all uploaded images (120+ files) with previews and URLs. Note: This is different from the 'Media assets' file picker - this shows ALL images in the repo."
    files:
      - name: "media-index"
        label: "All Images (120+ files)"
        file: "content/media-index.json"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "Uploaded Images"
            name: "files"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "File Name", name: "name", widget: "string", required: false, hint: "Image filename" }
              - { label: "Path", name: "path", widget: "string", required: false, hint: "Relative to assets/images/uploads/" }
              - { label: "Full URL", name: "url", widget: "string", required: false, hint: "Copy this URL to use in content" }
              - { label: "Preview Image", name: "preview", widget: "image", required: false, hint: "Click to see preview" }

  # ============================================
  # ADMIN COLLECTIONS (Internal Tools)
  # ============================================
  
  - name: "admin"
    label: "Admin Tools"
    description: "Quick access links and admin utilities"
    files:
      - name: "admin-links"
        label: "Quick Access Links"
        file: "content/admin-links.json"
        format: "json"
        editor:
          preview: false
        fields:
          - label: "Admin Dashboard Links"
            name: "links"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Payment & Commerce", value: "Payment & Commerce" }
                  - { label: "Ticketing", value: "Ticketing" }
                  - { label: "Fulfillment", value: "Fulfillment" }
                  - { label: "Development", value: "Development" }
                  - { label: "Infrastructure", value: "Infrastructure" }
                  - { label: "Analytics", value: "Analytics" }
                  - { label: "Social Media", value: "Social Media" }
                  - { label: "Website", value: "Website" }
