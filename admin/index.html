<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Still Got It Collective — Admin</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    
    /* Admin Links Panel - Sidebar Integration */
    #admin-links-panel {
      padding: 16px;
      border-top: 1px solid #e0e0e0;
      margin-top: 16px;
      font-size: 14px;
    }
    
    #admin-links-panel h3 {
      margin: 0 0 12px 0;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    #admin-links-panel .link-group {
      margin-bottom: 16px;
    }
    
    #admin-links-panel .link-group:last-child {
      margin-bottom: 0;
    }
    
    #admin-links-panel .link-group-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    
    #admin-links-panel .link-item {
      display: block;
      padding: 6px 8px;
      margin-bottom: 2px;
      color: #0066cc;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.2s;
      font-size: 13px;
    }
    
    #admin-links-panel .link-item:hover {
      background-color: #f5f5f5;
      text-decoration: underline;
    }
    
    #admin-links-panel .link-item:active {
      background-color: #e8e8e8;
    }
    
    /* Mobile Responsive Improvements for Decap CMS */
    @media (max-width: 768px) {
      /* Force full-width layout on mobile */
      body {
        overflow-x: hidden !important;
      }
      
      /* Improve sidebar on mobile - target Decap CMS classes */
      [class*="Sidebar"],
      [class*="sidebar"],
      .nc-sidebar,
      nav[class*="sidebar"],
      aside[class*="sidebar"],
      div[class*="Sidebar"],
      div[class*="sidebar"] {
        width: 100% !important;
        max-width: 100% !important;
        position: relative !important;
        transform: none !important;
      }
      
      /* Make main content area full width on mobile */
      [class*="MainView"],
      [class*="main-view"],
      [class*="Main"],
      [class*="main"],
      main,
      div[class*="MainView"],
      div[class*="main-view"] {
        width: 100% !important;
        max-width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        padding: 8px !important;
      }
      
      /* Improve form inputs on mobile */
      input[type="text"],
      input[type="email"],
      input[type="url"],
      input[type="date"],
      input[type="datetime-local"],
      textarea,
      select {
        font-size: 16px !important; /* Prevents zoom on iOS */
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
        padding: 12px !important;
      }
      
      /* Improve buttons on mobile */
      button,
      [role="button"],
      .btn,
      a[role="button"],
      input[type="button"],
      input[type="submit"] {
        min-height: 44px !important; /* Better touch target */
        padding: 12px 16px !important;
        font-size: 16px !important;
        touch-action: manipulation !important;
      }
      
      /* Improve modals on mobile */
      [class*="Modal"],
      [class*="modal"],
      .nc-modal,
      div[class*="Modal"],
      div[class*="modal"],
      [role="dialog"] {
        width: 100vw !important;
        max-width: 100vw !important;
        height: 100vh !important;
        max-height: 100vh !important;
        margin: 0 !important;
        border-radius: 0 !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
      }
      
      /* Improve media library/file picker on mobile */
      [class*="MediaLibrary"],
      [class*="media-library"],
      [class*="MediaLibrary"],
      [class*="FileUpload"],
      [class*="file-upload"],
      div[class*="Media"] {
        width: 100% !important;
        max-width: 100% !important;
      }
      
      /* Improve list views on mobile */
      [class*="List"],
      [class*="list"],
      ul[class*="list"],
      ol[class*="list"] {
        padding: 8px !important;
      }
      
      /* Improve admin links panel on mobile */
      #admin-links-panel {
        padding: 12px;
        font-size: 13px;
      }
      
      #admin-links-panel .link-item {
        padding: 10px 8px;
        font-size: 14px;
        min-height: 44px;
        display: flex;
        align-items: center;
      }
      
      /* Improve collection list items */
      a[href*="#/collections"],
      [class*="CollectionLink"],
      [class*="collection-link"] {
        padding: 12px 16px !important;
        min-height: 44px !important;
        font-size: 16px !important;
      }
    }
    
    @media (max-width: 480px) {
      /* Extra small screens */
      #admin-links-panel {
        padding: 10px;
      }
      
      #admin-links-panel h3 {
        font-size: 12px;
      }
      
      #admin-links-panel .link-item {
        font-size: 13px;
        padding: 12px 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Decap CMS Admin UI -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Force reload styles on mobile to ensure CSS updates are applied
    if (window.innerWidth <= 768) {
      const style = document.createElement('style');
      style.textContent = document.querySelector('style').textContent;
      document.head.appendChild(style);
    }
  </script>
  
  <!-- Admin Links Panel -->
  <div id="admin-links-panel" style="display: none;">
    <h3>Quick Access Links</h3>
    <div id="admin-links-content">
      <div class="link-group">
        <div class="link-group-title">Payment & Commerce</div>
        <a href="https://squareup.com/dashboard" target="_blank" rel="noopener" class="link-item">Square Dashboard</a>
        <a href="https://dashboard.stripe.com" target="_blank" rel="noopener" class="link-item">Stripe Dashboard</a>
      </div>
      <div class="link-group">
        <div class="link-group-title">Ticketing</div>
        <a href="https://ticketscandy.com/admin" target="_blank" rel="noopener" class="link-item">TicketsCandy Admin</a>
      </div>
      <div class="link-group">
        <div class="link-group-title">Fulfillment</div>
        <a href="https://www.printful.com/dashboard" target="_blank" rel="noopener" class="link-item">Printly Catalog</a>
      </div>
      <div class="link-group">
        <div class="link-group-title">Development</div>
        <a href="https://github.com/rpretzer/stillgotit" target="_blank" rel="noopener" class="link-item">GitHub Repo - StillGotIt</a>
      </div>
      <div class="link-group">
        <div class="link-group-title">Infrastructure</div>
        <a href="https://dash.cloudflare.com" target="_blank" rel="noopener" class="link-item">Cloudflare Dashboard</a>
      </div>
      <div class="link-group">
        <div class="link-group-title">Analytics</div>
        <a href="https://analytics.google.com" target="_blank" rel="noopener" class="link-item">GA4 Dashboard</a>
      </div>
      <div class="link-group">
        <div class="link-group-title">Social Media</div>
        <a href="https://business.facebook.com" target="_blank" rel="noopener" class="link-item">Meta Business Suite</a>
      </div>
      <div class="link-group">
        <div class="link-group-title">Website</div>
        <a href="https://account.squarespace.com" target="_blank" rel="noopener" class="link-item">SquareSpace Dashboard</a>
      </div>
    </div>
  </div>
  
  <script>
    // Inject admin links panel into CMS sidebar below Collections
    (function() {
      function injectAdminLinks() {
        const panel = document.getElementById('admin-links-panel');
        if (!panel) return;
        
        // Find the CMS sidebar - Decap CMS uses various selectors
        const sidebarSelectors = [
          '[class*="Sidebar"]',
          '[class*="sidebar"]',
          '.nc-sidebar',
          'nav[class*="sidebar"]',
          'aside',
          '[data-testid="sidebar"]'
        ];
        
        let sidebar = null;
        for (const selector of sidebarSelectors) {
          sidebar = document.querySelector(selector);
          if (sidebar) break;
        }
        
        // If we can't find a specific sidebar, look for the main navigation container
        if (!sidebar) {
          // Decap CMS typically has a structure like: body > div > nav or aside
          const navs = document.querySelectorAll('nav, aside, [role="navigation"]');
          for (const nav of navs) {
            // Check if it contains collection links (typical CMS sidebar content)
            if (nav.querySelector('a[href*="#/collections"], [class*="collection"], [class*="Collection"]')) {
              sidebar = nav;
              break;
            }
          }
        }
        
        if (sidebar) {
          // Check if already injected
          if (sidebar.querySelector('#admin-links-panel')) return;
          
          // Try to locate the last collection item and insert after it
          const collectionLinks = sidebar.querySelectorAll('a[href*="#/collections"]');
          let inserted = false;
          if (collectionLinks.length > 0) {
            const lastLink = collectionLinks[collectionLinks.length - 1];
            const lastItem = lastLink.closest('li');
            if (lastItem && lastItem.parentNode) {
              lastItem.parentNode.insertBefore(panel, lastItem.nextSibling);
              inserted = true;
            }
          }
          
          // Fallback: append at end of sidebar
          if (!inserted) {
            sidebar.appendChild(panel);
          }
          
          panel.style.display = 'block';
        } else {
          // Fallback: try after a delay
          setTimeout(injectAdminLinks, 500);
        }
      }
      
      // Try multiple times to catch CMS rendering
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', injectAdminLinks);
      } else {
        injectAdminLinks();
      }
      
      // Retry after delays to catch late-rendering CMS
      setTimeout(injectAdminLinks, 500);
      setTimeout(injectAdminLinks, 1000);
      setTimeout(injectAdminLinks, 2000);
      
      // Also watch for DOM changes (CMS might load dynamically)
      const observer = new MutationObserver(() => {
        if (!document.getElementById('admin-links-panel')?.parentElement) {
          injectAdminLinks();
        }
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    })();
  </script>
</body>
</html>
