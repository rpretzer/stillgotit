name: Deploy GitHub Pages (Static Site)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: generate a tiny JS file that exposes the publishable key to the frontend.
      # This file is NOT committed; it's produced at build time from the secret.
      - name: Inject Stripe publishable key
        run: |
          mkdir -p assets/js
          echo "🔍 Checking for NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY secret..."
          if [ -z "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" ]; then
            echo "❌ ERROR: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY secret is not set or is empty"
            echo "Please verify the secret exists in: Settings → Secrets and variables → Actions"
            echo "Secret name must be exactly: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
            echo "window.STRIPE_PUBLISHABLE_KEY='';" > assets/js/stripe-publishable.js
            exit 1
          else
            KEY_PREFIX=$(echo "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" | cut -c1-7)
            KEY_LENGTH=${#NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
            echo "✓ Stripe publishable key found!"
            echo "  - Key prefix: $KEY_PREFIX"
            echo "  - Key length: $KEY_LENGTH characters"
            if [[ ! "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" =~ ^pk_(test|live)_ ]]; then
              echo "⚠️  WARNING: Key doesn't start with 'pk_test_' or 'pk_live_' - may be invalid"
            fi
            echo "window.STRIPE_PUBLISHABLE_KEY='$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY';" > assets/js/stripe-publishable.js
            echo "✓ Key injected into assets/js/stripe-publishable.js"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



