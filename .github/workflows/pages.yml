name: Deploy GitHub Pages (Static Site)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: generate a tiny JS file that exposes the publishable key to the frontend.
      # This file is NOT committed; it's produced at build time from the secret.
      - name: Inject Stripe publishable key
        run: |
          mkdir -p assets/js
          echo "window.STRIPE_PUBLISHABLE_KEY='${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}'"; \
          echo "window.STRIPE_PUBLISHABLE_KEY='${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}'" > assets/js/stripe-publishable.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


