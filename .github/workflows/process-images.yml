name: Process incoming images

on:
  push:
    paths:
      - "assets/images/_incoming_raw/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-package-lock

      - name: Build gallery thumbs/full
        run: npm run images:build

      - name: Sync gallery.json
        run: npm run gallery:sync

      - name: Generate media index
        run: npm run media:index

      - name: Commit generated images and media index (if changed)
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add assets/images/uploads/gallery content/media-index.json content/gallery.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(images): generate gallery thumbs/full, sync gallery.json, and update media index"
          git push
