<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background with brand primary color -->
  <rect width="32" height="32" rx="6" fill="#e91e6f"/>
  
  <!-- Simple, bold "S" using rectangles for clarity at small sizes -->
  <!-- Top curve -->
  <rect x="8" y="6" width="16" height="4" rx="2" fill="#ffffff"/>
  <rect x="8" y="10" width="8" height="4" rx="2" fill="#ffffff"/>
  
  <!-- Middle bar -->
  <rect x="12" y="14" width="8" height="4" rx="2" fill="#ffffff"/>
  
  <!-- Bottom curve -->
  <rect x="16" y="18" width="8" height="4" rx="2" fill="#ffffff"/>
  <rect x="8" y="22" width="16" height="4" rx="2" fill="#ffffff"/>
</svg>
